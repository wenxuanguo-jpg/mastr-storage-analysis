name: Deploy existing MaStR dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-existing-dashboard.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mastr-pages
  cancel-in-progress: false

jobs:
  select-analysis-run:
    # Find the latest successful full analysis rather than tying the dashboard
    # to a short-lived, hard-coded artifact run ID.
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.analysis.outputs.run-id }}
    steps:
      - name: Find latest successful full analysis
        id: analysis
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "mastr-storage-analysis.yml",
              branch: "main",
              status: "completed",
              per_page: 100,
            });
            const run = response.data.workflow_runs.find(
              (item) => item.conclusion === "success",
            );
            if (!run) {
              core.setFailed("No successful full MaStR analysis artifact is available.");
              return;
            }
            core.setOutput("run-id", String(run.id));
            core.info(`Using analysis artifact from run ${run.id}.`);

  deploy:
    # This lightweight workflow republishes the latest frontend with a completed analysis artifact.
    needs: select-analysis-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mastr.txt

      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-mastr.txt

      - name: Download successful analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: mastr-balcony-dashboard-analysis
          path: restored-output
          repository: ${{ github.repository }}
          run-id: ${{ needs.select-analysis-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Rebuild dashboard payload
        run: python prepare_site_from_outputs.py --outputs restored-output --site site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
