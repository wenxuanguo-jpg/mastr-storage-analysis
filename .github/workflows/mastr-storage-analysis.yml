name: MaStR balcony dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mastr-pages
  cancel-in-progress: false

jobs:
  analyse-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MASTR_WORK_DIR: /tmp/mastr_export
      MASTR_OUTPUT_DIR: ${{ github.workspace }}/outputs
      MASTR_SITE_DIR: ${{ github.workspace }}/site
      MASTR_ENABLE_PAGES: "true"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mastr.txt

      - name: Install analysis dependencies
        run: python -m pip install -r requirements-mastr.txt

      - name: Build filtered datasets and dashboard data
        run: python mastr_official_export.py

      - name: Validate generated summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("outputs/mastr_dashboard_summary.json").read_text(encoding="utf-8"))
          for key in ("pv", "storage"):
              item = summary["categories"][key]
              print(f"{key}: {item['matching_records']:,} records")
              assert item["matching_records"] > 0, f"{key}: parser returned zero records"
              assert item["matching_records"] == item["unique_unit_ids"]
          assert summary["validation"]["monthly_totals_equal_counts"]
          assert summary["validation"]["unique_ids_equal_counts"]
          PY

      - name: Upload full filtered data and analysis
        uses: actions/upload-artifact@v4
        with:
          name: mastr-balcony-dashboard-analysis
          path: |
            outputs/balcony_pv.csv
            outputs/balcony_storage.csv
            outputs/mastr_dashboard_summary.json
            outputs/mastr_dashboard_monthly.json
            outputs/mastr_dashboard_features.json
            outputs/mastr_dashboard_analysis.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Configure GitHub Pages
        if: env.MASTR_ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: env.MASTR_ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        if: env.MASTR_ENABLE_PAGES == 'true'
        uses: actions/deploy-pages@v4

      - name: Upload dashboard files for private repository
        if: env.MASTR_ENABLE_PAGES != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mastr-dashboard-site
          path: site
          retention-days: 14
          compression-level: 0

      - name: Show runner disk usage
        if: always()
        run: df -h
